<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp GIS Dashboard</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #25D366;
            /* WhatsApp Green */
            --secondary-color: #075E54;
            --dark-bg: #111b21;
            --panel-bg: #202c33;
            --text-main: #e9edef;
            --text-dim: #8696a0;
            --glass: rgba(32, 44, 51, 0.8);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Assistant', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            overflow: hidden;
        }

        #layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
        }

        header {
            padding: 20px;
            background-color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stats-bar {
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
        }

        .filter-section {
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 0;
            transition: color 0.2s;
        }

        .filter-toggle:hover {
            color: var(--text-main);
        }

        .filter-toggle.active {
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .filter-controls {
            display: none;
        }

        .filter-controls.show {
            display: block;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .filter-group {
            flex: 1;
        }

        .filter-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 8px 10px;
            background: var(--dark-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-family: inherit;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .filter-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .filter-btn.primary {
            background: var(--primary-color);
            color: var(--dark-bg);
            font-weight: 600;
        }

        .filter-btn.primary:hover {
            background: #20c05c;
        }

        .filter-btn.secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-dim);
        }

        .filter-btn.secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .filter-active-badge {
            background: var(--primary-color);
            color: var(--dark-bg);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-right: 8px;
            font-weight: 600;
        }

        .tag-badge {
            background: var(--secondary-color);
            color: var(--text-main);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 5px;
            margin-bottom: 3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag-badge .remove-tag {
            cursor: pointer;
            margin-right: -2px;
            padding: 0 2px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .tag-badge .remove-tag:hover {
            opacity: 1;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .tag-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
        }

        .tag-input {
            flex: 1;
            padding: 4px 8px;
            background: var(--dark-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.8rem;
            font-family: inherit;
        }

        .tag-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .tag-input::placeholder {
            color: var(--text-dim);
        }

        .tag-add-btn {
            background: var(--primary-color);
            border: none;
            color: var(--dark-bg);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-add-btn:hover {
            background: #20c05c;
        }

        #report-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .report-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-right: 4px solid transparent;
        }

        .report-card:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .report-card.active {
            border-right-color: var(--primary-color);
            background-color: rgba(37, 211, 102, 0.1);
        }

        .report-card.hidden {
            opacity: 0.6;
            filter: grayscale(0.5);
        }

        .report-card .sender {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
            display: block;
        }

        .report-card .meta {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .report-card .snippet {
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 5px;
            text-transform: uppercase;
        }

        .badge-no-location {
            background-color: #ef4444;
            color: white;
        }

        .badge-hidden {
            background-color: #64748b;
            color: white;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
            padding-top: 5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            color: var(--text-dim);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .export-section {
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .export-section h3 {
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .export-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .export-btn {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-align: right;
        }

        .export-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary-color);
        }

        .export-btn span {
            font-size: 1.1rem;
        }

        .gmaps-link {
            color: #4285F4;
            text-decoration: none;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
            padding: 4px 8px;
            background: rgba(66, 133, 244, 0.1);
            width: fit-content;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .gmaps-link:hover {
            background: rgba(66, 133, 244, 0.2);
        }

        #map {
            flex: 1;
            height: 100%;
        }

        /* Leaflet Overrides */
        .leaflet-container {
            background: #0b141a !important;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: var(--panel-bg);
            color: var(--text-main);
            border-radius: 8px;
            padding: 5px;
        }

        .custom-popup .leaflet-popup-tip {
            background: var(--panel-bg);
        }

        .popup-content h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }

        .popup-content p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .popup-content .report-text {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Assistant', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div id="layout">
        <div id="sidebar">
            <header>
                <div
                    style="background: white; border-radius: 50%; padding: 5px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="#075E54">
                        <path
                            d="M12.072 1.761C6.462 1.761 1.894 6.328 1.894 11.938c0 1.791.467 3.473 1.284 4.938l-1.365 4.99 5.105-1.341c1.413.771 3.023 1.211 4.733 1.211 5.61 0 10.177-4.567 10.177-10.177 0-5.61-4.567-10.177-10.177-10.177zm0 18.61c-1.637 0-3.17-.432-4.503-1.189l-.323-.181-3.053.801.815-2.977-.198-.315c-.831-1.321-1.272-2.863-1.272-4.471 0-4.671 3.8-8.471 8.471-8.471s8.471 3.8 8.471 8.471-3.8 8.471-8.471 8.471zm4.646-6.347c-.255-.127-1.507-.743-1.74-.828-.233-.085-.403-.127-.573.127-.17.255-.658.828-.806.998-.148.17-.297.191-.552.064-.255-.127-1.076-.396-2.05-1.266-.76-.677-1.273-1.514-1.421-1.769-.148-.255-.016-.393.111-.519.115-.113.255-.297.382-.446.127-.148.17-.255.255-.424.085-.17.042-.319-.021-.446-.064-.127-.573-1.38-.785-1.888-.206-.499-.413-.432-.573-.441-.148-.007-.319-.009-.488-.009-.169 0-.446.064-.679.319-.233.255-.891.87-0.891 2.122 0 1.253.912 2.461 1.039 2.631.127.17 1.796 2.743 4.35 3.844.607.261 1.082.417 1.451.535.61.194 1.165.166 1.603.101.488-.072 1.507-.616 1.719-1.21.212-.594.212-1.103.148-1.21-.063-.107-.233-.17-.488-.297z" />
                    </svg>
                </div>
                <h1>דיווחי GIS WhatsApp</h1>
                <a href="/management" style="color: var(--text-dim); text-decoration: none; font-size: 0.8rem; margin-right: auto;">Management</a>
            </header>

            <div class="stats-bar">
                <span>דיווחים: <span id="stat-count">0</span> <span id="filtered-count"></span></span>
                <span>עודכן: <span id="stat-time">-</span></span>
            </div>

            <div class="filter-section">
                <div class="filter-toggle" onclick="toggleFilters()">
                    <span>
                        <span id="filter-badge" class="filter-active-badge" style="display: none;">פעיל</span>
                        🔍 סינון דיווחים
                    </span>
                    <span id="filter-arrow">▼</span>
                </div>
                <div id="filter-controls" class="filter-controls">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>מתאריך</label>
                            <input type="date" id="filter-from-date">
                        </div>
                        <div class="filter-group">
                            <label>עד תאריך</label>
                            <input type="date" id="filter-to-date">
                        </div>
                    </div>
                    <div class="filter-row">
                        <div class="filter-group">
                            <label>תג / סוג</label>
                            <select id="filter-tag">
                                <option value="">הכל</option>
                                <option value="__no_tag__">ללא תג</option>
                                <!-- Tags will be populated dynamically -->
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>קבוצה</label>
                            <select id="filter-group">
                                <option value="">הכל</option>
                                <!-- Groups will be populated dynamically -->
                            </select>
                        </div>
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn primary" onclick="applyFilters()">החל סינון</button>
                        <button class="filter-btn secondary" onclick="clearFilters()">נקה</button>
                    </div>
                </div>
            </div>

            <div id="report-list">
                <!-- Reports will be injected here -->
                <div style="text-align: center; padding: 20px; color: var(--text-dim);">טוען נתונים...</div>
            </div>

            <div class="export-section">
                <h3>ייצוא נתונים חיצוני <span id="export-filter-note" style="font-size: 0.7rem; font-weight: normal; color: var(--text-dim);"></span></h3>
                <div class="export-grid">
                    <button class="export-btn" onclick="exportData('kml')">
                        <span>🗺️</span> Google Maps (KML)
                    </button>
                    <button class="export-btn" onclick="exportData('geojson')">
                        <span>📍</span> GeoJSON
                    </button>
                    <button class="export-btn" onclick="exportData('shapefile')">
                        <span>📦</span> Shapefile (ZIP)
                    </button>
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function escAttr(s) { return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

        // Define Base Layers
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EBP, and the GIS User Community'
        });

        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OSM, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)'
        });

        const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© CartoDB'
        });

        // Initialize Map with Dark Mode as default
        const map = L.map('map', {
            zoomControl: false,
            layers: [dark] // Default layer
        }).setView([31.5, 34.8], 8);

        // Add Layer Control
        const baseLayers = {
            "מפת רחובות": osm,
            "לוויין": satellite,
            "טופוגרפי": topo,
            "מצב כהה": dark
        };

        const overlays = {};
        L.control.layers(baseLayers, overlays, { position: 'topright' }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);
        let allReports = [];
        let geojsonFeatures = [];
        let filteredReports = [];
        let activeFilters = {
            fromDate: null,
            toDate: null,
            tag: '',
            group: ''
        };

        // Filter UI functions
        function toggleFilters() {
            const controls = document.getElementById('filter-controls');
            const arrow = document.getElementById('filter-arrow');
            const toggle = document.querySelector('.filter-toggle');

            controls.classList.toggle('show');
            toggle.classList.toggle('active');
            arrow.textContent = controls.classList.contains('show') ? '▲' : '▼';
        }

        function applyFilters() {
            const fromDate = document.getElementById('filter-from-date').value;
            const toDate = document.getElementById('filter-to-date').value;
            const tag = document.getElementById('filter-tag').value;
            const group = document.getElementById('filter-group').value;

            activeFilters = {
                fromDate: fromDate ? new Date(fromDate) : null,
                toDate: toDate ? new Date(toDate + 'T23:59:59') : null, // End of day
                tag: tag,
                group: group
            };

            // Show/hide filter badge
            const hasActiveFilter = fromDate || toDate || tag || group;
            document.getElementById('filter-badge').style.display = hasActiveFilter ? 'inline' : 'none';

            // Update export note
            const exportNote = document.getElementById('export-filter-note');
            if (hasActiveFilter) {
                exportNote.textContent = '(יוצא רק דיווחים מסוננים)';
            } else {
                exportNote.textContent = '';
            }

            updateDisplayWithFilters();
        }

        function clearFilters() {
            document.getElementById('filter-from-date').value = '';
            document.getElementById('filter-to-date').value = '';
            document.getElementById('filter-tag').value = '';
            document.getElementById('filter-group').value = '';

            activeFilters = {
                fromDate: null,
                toDate: null,
                tag: '',
                group: ''
            };

            document.getElementById('filter-badge').style.display = 'none';
            document.getElementById('export-filter-note').textContent = '';
            updateDisplayWithFilters();
        }

        function filterReports(reports) {
            // If no filters are active, return all reports
            const hasActiveFilter = activeFilters.fromDate || activeFilters.toDate ||
                                   activeFilters.tag || activeFilters.group;
            if (!hasActiveFilter) {
                return reports;
            }

            return reports.filter(report => {
                const reportDate = new Date(report.started_at || report.created_at);

                // Date filter - skip if date is invalid
                if (activeFilters.fromDate && !isNaN(reportDate.getTime()) && reportDate < activeFilters.fromDate) {
                    return false;
                }
                if (activeFilters.toDate && !isNaN(reportDate.getTime()) && reportDate > activeFilters.toDate) {
                    return false;
                }

                // Tag filter
                if (activeFilters.tag) {
                    const reportTags = report.tags || [];
                    if (activeFilters.tag === '__no_tag__') {
                        if (reportTags.length > 0) return false;
                    } else {
                        if (!reportTags.includes(activeFilters.tag)) return false;
                    }
                }

                // Group filter
                if (activeFilters.group && report.group_name !== activeFilters.group) {
                    return false;
                }

                return true;
            });
        }

        function filterGeoJSON(features) {
            // If no filters are active, return all features
            const hasActiveFilter = activeFilters.fromDate || activeFilters.toDate ||
                                   activeFilters.tag || activeFilters.group;

            const filteredFeatures = hasActiveFilter ? features.filter(feature => {
                const props = feature.properties;
                const featureDate = new Date(props.timestamp);

                // Date filter - skip if date is invalid
                if (activeFilters.fromDate && !isNaN(featureDate.getTime()) && featureDate < activeFilters.fromDate) {
                    return false;
                }
                if (activeFilters.toDate && !isNaN(featureDate.getTime()) && featureDate > activeFilters.toDate) {
                    return false;
                }

                // Tag filter
                if (activeFilters.tag) {
                    const featureTags = props.tags || [];
                    if (activeFilters.tag === '__no_tag__') {
                        if (featureTags.length > 0) return false;
                    } else {
                        if (!featureTags.includes(activeFilters.tag)) return false;
                    }
                }

                // Group filter
                if (activeFilters.group && props.group_name !== activeFilters.group) {
                    return false;
                }

                return true;
            }) : features;

            return {
                type: 'FeatureCollection',
                features: filteredFeatures
            };
        }

        function updateDisplayWithFilters() {
            filteredReports = filterReports(allReports);
            const filteredGeoJSON = filterGeoJSON(geojsonFeatures);

            updateMap(filteredGeoJSON);
            updateSidebar(filteredReports);

            // Update count display
            const totalCount = allReports.length;
            const filteredCount = filteredReports.length;
            document.getElementById('stat-count').innerText = totalCount;

            if (filteredCount < totalCount) {
                document.getElementById('filtered-count').innerText = `(מוצגים: ${filteredCount})`;
            } else {
                document.getElementById('filtered-count').innerText = '';
            }
        }

        function populateFilterDropdowns() {
            // Populate groups dropdown
            const groupSelect = document.getElementById('filter-group');
            const groups = [...new Set(allReports.map(r => r.group_name).filter(Boolean))];

            // Keep existing options and add new ones
            const existingGroups = new Set([...groupSelect.options].map(o => o.value));
            groups.forEach(group => {
                if (!existingGroups.has(group)) {
                    const option = document.createElement('option');
                    option.value = group;
                    option.textContent = group;
                    groupSelect.appendChild(option);
                }
            });

            // Populate tags dropdown from all tags in all reports
            const tagSelect = document.getElementById('filter-tag');
            const allTags = new Set();
            allReports.forEach(r => {
                const reportTags = r.tags || [];
                reportTags.forEach(tag => allTags.add(tag));
            });

            const existingTags = new Set([...tagSelect.options].map(o => o.value));
            [...allTags].sort().forEach(tag => {
                if (!existingTags.has(tag)) {
                    const option = document.createElement('option');
                    option.value = tag;
                    option.textContent = tag;
                    tagSelect.appendChild(option);
                }
            });
        }

        async function fetchData() {
            try {
                // Fetch reports for sidebar (includes those without location)
                const reportsRes = await fetch('/reports');
                const reportsData = await reportsRes.json();
                allReports = reportsData.reports;

                // Fetch GeoJSON for map markers
                const geoRes = await fetch('/api/geojson');
                const geoData = await geoRes.json();
                geojsonFeatures = geoData.features;

                // Populate filter dropdowns with available options
                populateFilterDropdowns();

                // Apply current filters and update display
                updateDisplayWithFilters();

                document.getElementById('stat-time').innerText = new Date().toLocaleTimeString('he-IL');
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateMap(geojsonData) {
            markersGroup.clearLayers();

            const geojsonLayer = L.geoJSON(geojsonData, {
                filter: (feature) => {
                    return feature.properties.is_visible !== false;
                },
                pointToLayer: (feature, latlng) => {
                    return L.circleMarker(latlng, {
                        radius: 8,
                        fillColor: '#25D366',
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                },
                style: (feature) => {
                    // Style for LineString/MultiLineString (tracks)
                    if (feature.geometry.type !== 'Point') {
                        return {
                            color: '#FF6B35',
                            weight: 3,
                            opacity: 0.8
                        };
                    }
                    return {};
                },
                onEachFeature: (feature, layer) => {
                    const props = feature.properties;
                    const date = new Date(props.timestamp).toLocaleString('he-IL');

                    let popupContent;
                    if (props._type === 'track') {
                        popupContent = `
                        <div class="popup-content" dir="rtl">
                            <h3>🛤️ ${esc(props.name) || 'מסלול ללא שם'}</h3>
                            <p><strong>קבוצה:</strong> ${esc(props.group_name) || 'לא ידוע'}</p>
                            <p><strong>זמן:</strong> ${esc(date)}</p>
                            <p><strong>מקור:</strong> ${esc(props.source_filename) || 'לא ידוע'}</p>
                            ${props.description ? `<div class="report-text">${esc(props.description)}</div>` : ''}
                        </div>`;
                    } else {
                        popupContent = `
                        <div class="popup-content" dir="rtl">
                            <h3>${esc(props.sender_name) || 'דיווח ללא שם'}</h3>
                            <p><strong>קבוצה:</strong> ${esc(props.group_name) || 'לא ידוע'}</p>
                            <p><strong>זמן:</strong> ${esc(date)}</p>
                            ${props.address ? `<p><strong>כתובת:</strong> ${esc(props.address)}</p>` : ''}
                            ${props.media_url ? `
                                <div style="margin-top: 10px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                                    <img src="${escAttr(props.media_url)}" style="width: 100%; display: block; cursor: zoom-in;" onclick="window.open('${escAttr(props.media_url)}', '_blank')">
                                </div>
                            ` : ''}
                            ${props.report_text ? `
                                <div class="report-text">${esc(props.report_text)}</div>
                            ` : (props.caption ? `<p class="report-text">${esc(props.caption)}</p>` : '<p><i>אין תוכן הודעה מצורף</i></p>')}
                        </div>`;
                    }

                    layer.bindPopup(popupContent, { className: 'custom-popup', minWidth: 250 });
                }
            });

            markersGroup.addLayer(geojsonLayer);

            // Fit bounds if it's the first load and we have data
            if (markersGroup.getLayers().length > 0 && map.getZoom() === 8) {
                const layers = markersGroup.getLayers()[0].getLayers();
                if (layers.length > 0) {
                    const bounds = L.featureGroup(layers).getBounds();
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        }

        function updateSidebar(reports) {
            const listContainer = document.getElementById('report-list');
            listContainer.innerHTML = '';

            if (reports.length === 0) {
                listContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-dim);">אין דיווחים להצגה</div>';
                return;
            }

            reports.forEach(report => {
                const date = new Date(report.started_at || report.created_at).toLocaleString('he-IL', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                const hasLocation = report.latitude !== null && report.longitude !== null;
                const isVisible = report.is_visible !== false;

                const card = document.createElement('div');
                card.className = `report-card ${isVisible ? '' : 'hidden'}`;

                // Construct snippet from messages if available
                let snippet = '';
                if (report.messages && report.messages.length > 0) {
                    const firstMsg = report.messages.find(m => m.text);
                    snippet = firstMsg ? firstMsg.text : 'דיווח ללא טקסט';
                }

                const reportTags = report.tags || [];
                const tagsHtml = reportTags.length > 0 ? `
                    <div class="tags-container" onclick="event.stopPropagation()">
                        ${reportTags.map(tag => `
                            <span class="tag-badge">
                                🏷️ ${esc(tag)}
                                <span class="remove-tag" onclick="removeTag('${escAttr(report.report_id)}', '${escAttr(tag)}', event)">×</span>
                            </span>
                        `).join('')}
                    </div>
                ` : '';

                card.innerHTML = `
                <div style="display: flex; gap: 12px; align-items: flex-start;">
                    <div style="flex: 1; min-width: 0;">
                        <span class="sender">
                            ${esc(report.sender_name) || 'אנונימי'}
                            ${!hasLocation ? '<span class="status-badge badge-no-location">ללא מיקום</span>' : ''}
                            ${!isVisible ? '<span class="status-badge badge-hidden">מוסתר</span>' : ''}
                        </span>
                        <div class="meta">${esc(date)} | ${esc(report.group_name) || 'ללא קבוצה'}</div>
                        ${tagsHtml}
                        <div class="snippet" style="max-height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                            ${esc(snippet)}
                        </div>

                        ${hasLocation ? `
                            <a href="https://www.google.com/maps/search/?api=1&query=${report.latitude},${report.longitude}" target="_blank" class="gmaps-link" onclick="event.stopPropagation()">
                                <span>📍</span> צפה ב-Google Maps
                            </a>
                        ` : ''}

                        <div class="tag-input-wrapper" onclick="event.stopPropagation()">
                            <input type="text" class="tag-input" placeholder="הוסף תג..." id="tag-input-${escAttr(report.report_id)}" list="tag-suggestions" onkeypress="if(event.key==='Enter'){addTag('${escAttr(report.report_id)}');event.preventDefault();}">
                            <button class="tag-add-btn" onclick="addTag('${escAttr(report.report_id)}')">הוסף</button>
                        </div>

                        <div class="card-actions">
                            <button class="action-btn" title="${isVisible ? 'הסתר מהמפה' : 'הצג במפה'}" onclick="toggleVisibility(event, '${escAttr(report.report_id)}', ${isVisible})">
                                ${isVisible ? `
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                ` : `
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                `}
                            </button>
                            <button class="action-btn delete" title="מחק דיווח" onclick="deleteReport(event, '${escAttr(report.report_id)}')">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;

                card.onclick = () => {
                    if (hasLocation) {
                        // Fly to location
                        map.flyTo([report.latitude, report.longitude], 15);

                        // Highlight marker by opening its popup
                        markersGroup.eachLayer(layer => {
                            if (layer.eachLayer) {
                                layer.eachLayer(l => {
                                    if (l.feature.properties.report_id === report.report_id) {
                                        l.openPopup();
                                    }
                                });
                            }
                        });
                    }

                    // Highlight card
                    document.querySelectorAll('.report-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                };

                listContainer.appendChild(card);
            });
        }

        async function toggleVisibility(event, reportId, currentState) {
            event.stopPropagation();
            try {
                const response = await fetch(`/api/reports/${reportId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_visible: !currentState })
                });
                if (response.ok) {
                    fetchData();
                }
            } catch (error) {
                console.error('Error toggling visibility:', error);
            }
        }

        async function deleteReport(event, reportId) {
            event.stopPropagation();
            if (!confirm('האם אתה בטוח שברצונך למחוק דיווח זה? פעולה זו אינה ניתנת לביטול.')) {
                return;
            }
            try {
                const response = await fetch(`/api/reports/${reportId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    fetchData();
                }
            } catch (error) {
                console.error('Error deleting report:', error);
            }
        }

        async function addTag(reportId) {
            const input = document.getElementById(`tag-input-${reportId}`);
            const newTag = input.value.trim();

            if (!newTag) return;

            // Get current report tags
            const report = allReports.find(r => r.report_id === reportId);
            if (!report) return;

            const currentTags = report.tags || [];

            // Don't add duplicate tags
            if (currentTags.includes(newTag)) {
                input.value = '';
                return;
            }

            const updatedTags = [...currentTags, newTag];

            try {
                const response = await fetch(`/api/reports/${reportId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tags: updatedTags })
                });
                if (response.ok) {
                    input.value = '';
                    fetchData();
                }
            } catch (error) {
                console.error('Error adding tag:', error);
            }
        }

        async function removeTag(reportId, tagToRemove, event) {
            if (event) event.stopPropagation();

            // Get current report tags
            const report = allReports.find(r => r.report_id === reportId);
            if (!report) return;

            const currentTags = report.tags || [];
            const updatedTags = currentTags.filter(tag => tag !== tagToRemove);

            try {
                const response = await fetch(`/api/reports/${reportId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tags: updatedTags })
                });
                if (response.ok) {
                    fetchData();
                }
            } catch (error) {
                console.error('Error removing tag:', error);
            }
        }

        async function fetchTags() {
            try {
                const response = await fetch('/api/tags');
                const data = await response.json();
                updateTagSuggestions(data.tags);
            } catch (error) {
                console.error('Error fetching tags:', error);
            }
        }

        function updateTagSuggestions(tags) {
            let datalist = document.getElementById('tag-suggestions');
            if (!datalist) {
                datalist = document.createElement('datalist');
                datalist.id = 'tag-suggestions';
                document.body.appendChild(datalist);
            }
            datalist.innerHTML = tags.map(tag => `<option value="${escAttr(tag)}">`).join('');
        }

        function exportData(format) {
            // Build query string with current filters
            const params = new URLSearchParams();

            if (activeFilters.fromDate) {
                params.append('from_date', activeFilters.fromDate.toISOString().split('T')[0]);
            }
            if (activeFilters.toDate) {
                params.append('to_date', activeFilters.toDate.toISOString().split('T')[0]);
            }
            if (activeFilters.tag) {
                params.append('tag', activeFilters.tag);
            }
            if (activeFilters.group) {
                params.append('group', activeFilters.group);
            }

            const queryString = params.toString();
            const url = `/export/${format}${queryString ? '?' + queryString : ''}`;
            window.open(url, '_blank');
        }

        // Initial fetch
        fetchData();
        fetchTags();

        // Auto-refresh every 30 seconds
        setInterval(fetchData, 30000);
        setInterval(fetchTags, 60000); // Refresh tags every minute
    </script>

</body>

</html>
