<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Bot - Operations Center</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-surface: #111820;
            --bg-card: #161d27;
            --bg-elevated: #1c2533;
            --border: rgba(56, 189, 126, 0.12);
            --border-strong: rgba(56, 189, 126, 0.25);
            --accent: #38bd7e;
            --accent-glow: rgba(56, 189, 126, 0.4);
            --accent-dim: rgba(56, 189, 126, 0.15);
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
            --warning: #f59e0b;
            --warning-dim: rgba(245, 158, 11, 0.12);
            --text: #e2e8f0;
            --text-secondary: #8899aa;
            --text-muted: #556677;
            --topo-line: rgba(56, 189, 126, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans Hebrew', 'IBM Plex Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            background-image:
                repeating-linear-gradient(0deg, var(--topo-line) 0px, var(--topo-line) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, var(--topo-line) 0px, var(--topo-line) 1px, transparent 1px, transparent 40px);
        }

        /* ===== Header ===== */
        .header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #2a9d6a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .header-title span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .header-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .header-nav a:hover {
            color: var(--accent);
            border-color: var(--border);
            background: var(--accent-dim);
        }

        /* ===== Layout ===== */
        .main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 32px 48px;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ===== Service Cards ===== */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }

        .svc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .svc-card:hover { border-color: var(--border-strong); }
        .svc-card.is-running { border-color: rgba(56, 189, 126, 0.2); }
        .svc-card.is-running::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100px; height: 100px;
            background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
            pointer-events: none;
        }

        .svc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .svc-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .svc-status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .status-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .status-indicator.on {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow), 0 0 2px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        .status-indicator.off { background: var(--text-muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .svc-meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 14px;
            min-height: 18px;
        }

        .svc-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        /* ===== Buttons ===== */
        .btn {
            font-family: 'IBM Plex Sans Hebrew', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 7px 18px;
            border: 1px solid transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
        }
        .btn-primary:hover { box-shadow: 0 4px 14px var(--accent-glow); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .btn-danger:hover { box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3); }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border-strong);
        }
        .btn-ghost:hover { background: var(--bg-elevated); color: var(--text); }

        .btn-ghost-danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
            font-size: 0.75rem;
        }
        .btn-ghost-danger:hover { background: var(--danger-dim); }

        .btn-sm { padding: 5px 12px; font-size: 0.75rem; }

        /* ===== Auth Section ===== */
        .auth-area {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .auth-badge.connected { background: var(--accent-dim); color: var(--accent); }
        .auth-badge.waiting { background: var(--warning-dim); color: var(--warning); }
        .auth-badge.error { background: var(--danger-dim); color: var(--danger); }
        .auth-badge.idle { background: rgba(85, 102, 119, 0.15); color: var(--text-muted); }

        .token-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .token-input {
            flex: 1;
            padding: 7px 12px;
            border-radius: 7px;
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem;
            transition: border-color 0.2s;
        }
        .token-input:focus { outline: none; border-color: var(--accent); }

        .auth-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        /* ===== QR Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 32px 36px;
            text-align: center;
            max-width: 380px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            animation: modalIn 0.25s ease-out;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: none; } }

        .modal-box h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .qr-frame {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #fff;
            border-radius: 14px;
        }

        .qr-frame img {
            width: 240px;
            height: 240px;
            image-rendering: pixelated;
        }

        .qr-hint {
            color: #667;
            font-size: 0.75rem;
            margin-top: 10px;
        }

        /* ===== Tabs ===== */
        .tab-bar {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .tab-item {
            padding: 10px 22px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .tab-item:hover { color: var(--text-secondary); }
        .tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* ===== Table ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .data-table th {
            background: var(--bg-elevated);
            padding: 10px 16px;
            text-align: right;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .data-table td {
            padding: 11px 16px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--text-secondary); }

        .toggle { position: relative; width: 40px; height: 22px; display: inline-block; }
        .toggle input { display: none; }
        .toggle .slider {
            position: absolute; inset: 0;
            background: var(--text-muted); border-radius: 22px; cursor: pointer; transition: 0.3s;
        }
        .toggle .slider::before {
            content: ''; position: absolute;
            width: 16px; height: 16px; right: 3px; bottom: 3px;
            background: white; border-radius: 50%; transition: 0.3s;
        }
        .toggle input:checked + .slider { background: var(--accent); }
        .toggle input:checked + .slider::before { transform: translateX(-18px); }

        .btn-icon-delete {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 1rem; padding: 2px 6px;
            border-radius: 4px; transition: all 0.2s;
        }
        .btn-icon-delete:hover { color: var(--danger); background: var(--danger-dim); }

        /* ===== Discovered Groups ===== */
        .discovery-area {
            margin-top: 16px;
        }

        .discovery-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .discovery-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 32px;
        }

        .chip {
            font-family: 'IBM Plex Sans Hebrew', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 14px;
            border-radius: 20px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--border-strong);
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover { background: rgba(56, 189, 126, 0.25); box-shadow: 0 2px 8px var(--accent-glow); transform: translateY(-1px); }

        .discovery-empty {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ===== Manual Add Form ===== */
        .add-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .add-row input {
            flex: 1;
            min-width: 120px;
            padding: 7px 12px;
            border-radius: 7px;
            border: 1px solid var(--border-strong);
            background: var(--bg-surface);
            color: var(--text);
            font-family: inherit;
            font-size: 0.82rem;
            transition: border-color 0.2s;
        }
        .add-row input:focus { outline: none; border-color: var(--accent); }

        .dm-check {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* ===== Log Viewer ===== */
        .log-viewer {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            max-height: 280px;
            overflow-y: auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            line-height: 1.6;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            margin-bottom: 24px;
        }
        .log-viewer.visible { display: block; }

        /* ===== Notification Toast ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-elevated);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 9999;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: rgba(239, 68, 68, 0.4); }
        .toast.success { border-color: rgba(56, 189, 126, 0.4); }

        @media (max-width: 700px) {
            .services-grid { grid-template-columns: 1fr; }
            .add-row { flex-direction: column; }
            .main { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">&#x1f6f0;</div>
            <div class="header-title">Operations Center <span>GIS Bot</span></div>
        </div>
        <nav class="header-nav">
            <a href="/dashboard">Dashboard</a>
        </nav>
    </div>

    <div class="main">
        <div class="section-label">Services</div>
        <div class="services-grid" id="services-grid"></div>

        <div class="log-viewer" id="log-viewer"></div>

        <div class="section-label">Group Configuration</div>
        <div>
            <div class="tab-bar">
                <div class="tab-item active" data-platform="whatsapp" onclick="switchTab('whatsapp')">WhatsApp</div>
                <div class="tab-item" data-platform="telegram" onclick="switchTab('telegram')">Telegram</div>
            </div>
            <table class="data-table">
                <thead><tr><th>Name</th><th>Group ID</th><th>Active</th><th>DM</th><th></th></tr></thead>
                <tbody id="groups-body"></tbody>
            </table>

            <div class="discovery-area">
                <div class="discovery-label">Discovered Groups</div>
                <div class="discovery-chips" id="discovered-groups"></div>
            </div>

            <div class="add-row">
                <input type="text" id="new-group-name" placeholder="Group name (manual)">
                <input type="text" id="new-group-id" placeholder="Group ID (manual)">
                <label class="dm-check"><input type="checkbox" id="new-group-dm"> DM</label>
                <button class="btn btn-primary btn-sm" onclick="addGroup()">Add</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="qr-modal" onclick="closeQrModal(event)">
        <div class="modal-box">
            <h3>Scan with WhatsApp</h3>
            <div class="qr-frame">
                <img id="qr-image" alt="QR Code" style="width:240px;height:240px">
                <div class="qr-hint">WhatsApp &gt; Settings &gt; Linked Devices &gt; Link a Device</div>
            </div>
            <div style="margin-top:18px">
                <button class="btn btn-ghost" onclick="document.getElementById('qr-modal').classList.remove('visible')">Close</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function escAttr(s) { return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

        let currentPlatform = 'whatsapp';
        let activeLogService = null;
        let logInterval = null;
        let authStates = {};
        let lastQrData = null;
        let apiKey = '';

        async function loadApiKey() {
            try { const r = await fetch('/api/config/ui'); const d = await r.json(); apiKey = d.api_key || ''; } catch(e) {}
        }
        function authHeaders() { const h = {'Content-Type':'application/json'}; if(apiKey) h['X-API-Key']=apiKey; return h; }
        function authFetchOpts(method='POST', body=null) { const o={method,headers:authHeaders()}; if(body) o.body=JSON.stringify(body); return o; }

        // ===== Services =====
        async function loadServices() {
            try { const r = await fetch('/api/services'); const d = await r.json(); renderServices(d.services); } catch(e) {}
        }

        function renderServices(services) {
            const grid = document.getElementById('services-grid');
            grid.innerHTML = services.map(svc => {
                const on = svc.running;
                const up = on ? formatUptime(svc.uptime_seconds) : '';
                const meta = on ? `PID ${svc.pid}${up ? ' &middot; ' + up : ''}` : '&mdash;';
                const auth = authStates[svc.service] || {};
                const authHtml = svc.service === 'whatsapp' ? renderWAAuth(on, auth) : renderTGAuth(on, auth);

                return `
                <div class="svc-card ${on ? 'is-running' : ''}">
                    <div class="svc-top">
                        <span class="svc-name">${svc.name}</span>
                        <span class="svc-status">
                            <span class="status-indicator ${on ? 'on' : 'off'}"></span>
                            ${on ? 'ONLINE' : 'OFFLINE'}
                        </span>
                    </div>
                    <div class="svc-meta">${meta}</div>
                    <div class="svc-actions">
                        ${on
                            ? `<button class="btn btn-danger btn-sm" onclick="stopService('${svc.service}')">Stop</button>`
                            : `<button class="btn btn-primary btn-sm" onclick="startService('${svc.service}')">Start</button>`
                        }
                        <button class="btn btn-ghost btn-sm" onclick="toggleLogs('${svc.service}')">Logs</button>
                    </div>
                    ${authHtml}
                </div>`;
            }).join('');

            if (document.getElementById('qr-modal').classList.contains('visible')) renderQrCode();
        }

        function renderWAAuth(on, auth) {
            const s = auth.status || 'disconnected';
            let badge = '', extra = '';

            if (!on) badge = `<span class="auth-badge idle">Idle</span>`;
            else if (s === 'authenticated') badge = `<span class="auth-badge connected">&#x2713; Connected</span>`;
            else if (s === 'qr_ready') {
                badge = `<span class="auth-badge waiting">QR Ready</span>`;
                extra = `<button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="openQrModal()">Scan QR Code</button>`;
            }
            else if (s === 'waiting_qr') badge = `<span class="auth-badge waiting">Initializing...</span>`;
            else if (s === 'auth_failure') badge = `<span class="auth-badge error">Auth Failed</span>`;
            else badge = `<span class="auth-badge idle">Connecting...</span>`;

            return `<div class="auth-area">${badge}${extra}<div class="auth-actions"><button class="btn btn-ghost-danger btn-sm" onclick="disconnectService('whatsapp')">Disconnect</button></div></div>`;
        }

        function renderTGAuth(on, auth) {
            const s = auth.status || 'disconnected';
            const u = auth.bot_username || '';
            let badge = '';

            if (on && s === 'authenticated' && u) badge = `<span class="auth-badge connected">&#x2713; @${esc(u)}</span>`;
            else if (on && s === 'auth_failure') badge = `<span class="auth-badge error">Failed</span>`;
            else if (on) badge = `<span class="auth-badge waiting">Connecting...</span>`;

            const disc = (on && (s === 'authenticated' || s === 'auth_failure'))
                ? `<button class="btn btn-ghost-danger btn-sm" onclick="disconnectService('telegram')">Disconnect</button>` : '';

            return `<div class="auth-area">${badge}${disc}
                <div class="token-row">
                    <input type="text" class="token-input" id="tg-token-input" placeholder="Bot token from @BotFather">
                    <button class="btn btn-primary btn-sm" onclick="saveTelegramToken()">Save</button>
                </div>
            </div>`;
        }

        // ===== QR =====
        function openQrModal() { document.getElementById('qr-modal').classList.add('visible'); setTimeout(()=>renderQrCode(true),100); }
        function closeQrModal(e) { if(e.target===e.currentTarget) document.getElementById('qr-modal').classList.remove('visible'); }

        function renderQrCode(force=false) {
            const img = document.getElementById('qr-image');
            const auth = authStates['whatsapp'] || {};
            if (img && auth.qr_data && auth.status === 'qr_ready') {
                if (auth.qr_data !== lastQrData || force) {
                    lastQrData = auth.qr_data;
                    QRCode.toDataURL(auth.qr_data, {width:300,margin:1,color:{dark:'#000000',light:'#ffffff'}}, function(err,url) { if(!err&&img) img.src=url; });
                }
            } else if (auth.status === 'authenticated') {
                document.getElementById('qr-modal').classList.remove('visible');
                lastQrData = null;
            } else { lastQrData = null; }
        }

        async function saveTelegramToken() {
            const input = document.getElementById('tg-token-input');
            const token = input ? input.value.trim() : '';
            if (!token) { notify('Enter a bot token', true); return; }
            try {
                const r = await fetch('/api/services/telegram/token', authFetchOpts('POST',{token}));
                const d = await r.json();
                if (d.error) notify(d.error, true); else { notify('Token saved'); input.value=''; }
            } catch(e) { notify('Failed to save token', true); }
        }

        // ===== Polling =====
        async function pollAuth() {
            for (const n of ['whatsapp','telegram']) {
                try { const r = await fetch(`/api/services/${n}/auth`); authStates[n] = await r.json(); } catch(e) {}
            }
        }

        function formatUptime(s) { if(!s) return ''; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; if(h>0) return h+'h '+m+'m'; if(m>0) return m+'m '+sec+'s'; return sec+'s'; }

        async function startService(n) { try { const r=await fetch(`/api/services/${n}/start`,authFetchOpts()); const d=await r.json(); if(d.error) notify(d.error,true); else notify(d.name+' started'); loadServices(); } catch(e){notify('Failed',true);} }
        async function stopService(n) { try { const r=await fetch(`/api/services/${n}/stop`,authFetchOpts()); const d=await r.json(); notify(d.name+' stopped'); loadServices(); } catch(e){notify('Failed',true);} }
        async function disconnectService(n) {
            if(!confirm('Disconnect '+n+'? This stops the service and clears its session.')) return;
            try { const r=await fetch(`/api/services/${n}/disconnect`,authFetchOpts()); const d=await r.json(); notify(d.name+' disconnected'); await pollAuth(); loadServices(); } catch(e){notify('Failed',true);}
        }

        async function toggleLogs(n) {
            const v = document.getElementById('log-viewer');
            if (activeLogService===n) { v.classList.remove('visible'); activeLogService=null; if(logInterval) clearInterval(logInterval); return; }
            activeLogService=n; v.classList.add('visible'); await refreshLogs(); if(logInterval) clearInterval(logInterval); logInterval=setInterval(refreshLogs,3000);
        }
        async function refreshLogs() { if(!activeLogService) return; try { const r=await fetch(`/api/services/${activeLogService}/logs?lines=100`); const d=await r.json(); const v=document.getElementById('log-viewer'); v.textContent=d.logs||'(no logs)'; v.scrollTop=v.scrollHeight; } catch(e){} }

        // ===== Groups =====
        let configuredGroupIds = new Set();

        async function loadGroups() {
            try { const r=await fetch(`/api/groups?platform=${currentPlatform}`); const d=await r.json(); configuredGroupIds=new Set(d.groups.map(g=>g.group_id)); renderGroups(d.groups); loadDiscoveredGroups(); } catch(e){}
        }

        async function loadDiscoveredGroups() {
            const c = document.getElementById('discovered-groups');
            try {
                const r = await fetch(`/api/services/${currentPlatform}/discovered-groups`);
                const d = await r.json();
                const groups = (d.groups||[]).filter(g=>!configuredGroupIds.has(g.id));
                if (!groups.length) { c.innerHTML = '<span class="discovery-empty">No new groups. Start the listener and send a message.</span>'; return; }
                c.innerHTML = groups.map(g=>`<button class="chip" onclick="quickAddGroup('${escAttr(g.id)}','${escAttr(g.name)}')">+ ${esc(g.name||g.id)}</button>`).join('');
            } catch(e) { c.innerHTML=''; }
        }

        async function quickAddGroup(id,name) {
            try { const r=await fetch('/api/groups',authFetchOpts('POST',{platform:currentPlatform,group_id:id,group_name:name,is_dm:false})); const d=await r.json(); if(d.error) notify(d.error,true); else { notify('Added: '+(name||id)); loadGroups(); } } catch(e){notify('Failed',true);}
        }

        function renderGroups(groups) {
            const b = document.getElementById('groups-body');
            if (!groups.length) { b.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">No groups configured</td></tr>`; return; }
            b.innerHTML = groups.map(g=>`<tr>
                <td>${esc(g.group_name||'-')}</td>
                <td class="mono">${esc(g.group_id)}</td>
                <td><label class="toggle"><input type="checkbox" ${g.is_active?'checked':''} onchange="toggleGroup(${g.id},this.checked)"><span class="slider"></span></label></td>
                <td style="color:var(--text-muted)">${g.is_dm?'Yes':'-'}</td>
                <td><button class="btn-icon-delete" onclick="deleteGroup(${g.id})" title="Delete">&times;</button></td>
            </tr>`).join('');
        }

        function switchTab(p) { currentPlatform=p; document.querySelectorAll('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.platform===p)); loadGroups(); }
        async function toggleGroup(id,active) { try { await fetch(`/api/groups/${id}`,authFetchOpts('PATCH',{is_active:active})); notify(active?'Activated':'Deactivated'); } catch(e){notify('Failed',true);loadGroups();} }
        async function deleteGroup(id) { if(!confirm('Delete this group?')) return; try { await fetch(`/api/groups/${id}`,authFetchOpts('DELETE')); notify('Deleted'); loadGroups(); } catch(e){notify('Failed',true);} }

        async function addGroup() {
            const name=document.getElementById('new-group-name').value.trim();
            const gid=document.getElementById('new-group-id').value.trim();
            const dm=document.getElementById('new-group-dm').checked;
            if(!gid){notify('Group ID required',true);return;}
            try { const r=await fetch('/api/groups',authFetchOpts('POST',{platform:currentPlatform,group_id:gid,group_name:name,is_dm:dm})); const d=await r.json(); if(d.error) notify(d.error,true); else { notify('Added'); document.getElementById('new-group-name').value=''; document.getElementById('new-group-id').value=''; document.getElementById('new-group-dm').checked=false; loadGroups(); } } catch(e){notify('Failed',true);}
        }

        function notify(msg, isError=false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show ' + (isError ? 'error' : 'success');
            setTimeout(()=>{ el.classList.remove('show'); }, 3000);
        }

        async function init() {
            await loadApiKey();
            await pollAuth();
            loadServices();
            loadGroups();
            setInterval(async()=>{ await pollAuth(); loadServices(); }, 2000);
            setInterval(loadGroups, 5000);
        }
        init();
    </script>
</body>
</html>
